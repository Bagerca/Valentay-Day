<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Можете заменить GIF на что-то более подходящее стилю, например: https://media.tenor.com/j5t3C-k-iMAAAAAC/anime-couple.gif -->
        <img src="https://media.tenor.com/E28vIanjT5cAAAAi/love-you.gif" alt="valentine-gif">
        
        <!-- Контейнер для текста песни (будет скрыт позже) -->
        <div id="lyrics-container">
            <h1 id="lyrics">...</h1>
        </div>

        <!-- Скрытый контейнер для твоего письма -->
        <div id="letter-container">
            <h2>А теперь серьезно...</h2>
            <p>
                <!-- 
                !!! ВАЖНО !!!
                ЗАМЕНИ ЭТОТ ТЕКСТ НА СВОЕ ЛИЧНОЕ ПИСЬМО.
                Используй <br><br> для создания нового абзаца.
                -->

                Возможно, эта песня кажется странным выбором для валентинки, но я хотел начать с чего-то дерзкого, чтобы потом сказать главное.
                <br><br>
                На самом деле, все эти слова из песни — полная противоположность тому, что я к тебе чувствую. Спасибо тебе за всё.
                <br><br>
                С любовью, [Твоё Имя]
            </p>
        </div>
    </div>

    <!-- Аудиоплеер (он будет невидимым) -->
    <audio id="player" src="music.mp3"></audio>

    <!-- Подключаем наш скрипт -->
    <script src="script.js"></script>
</body>
</html>
