<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="https://usagif.com/wp-content/uploads/gif-i-love-you-4.gif" alt="valentine-gif">
        
        <div id="lyrics-container">
            <h1 id="lyrics">...</h1>
            <span id="ghost-text"></span>
        </div>

        <!-- НОВЫЙ КОД: ПЛЕЕР -->
        <div id="player-container">
            <div class="song-info">
                <p>Сейчас играет</p>
                <h3>CMH - Счастье — это не для нас</h3>
            </div>
            
            <div class="progress-bar-container">
                <input type="range" id="progress-bar" value="0" step="1">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button id="play-pause-btn" class="control-btn">
                    <!-- Иконка Play -->
                    <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px"><path d="M8 5v14l11-7z"></path></svg>
                    <!-- Иконка Pause -->
                    <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                <div class="volume-control">
                    <button id="volume-btn" class="control-btn">
                        <!-- Иконка Volume -->
                        <svg id="volume-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
                         <!-- Иконка Mute -->
                        <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>

        <div id="letter-container">
            <h2>А теперь серьезно...</h2>
            <p></p>
        </div>
    </div>

    <audio id="player" src="music.mp3"></audio>
    <script src="script.js"></script>

    <div id="beat-visualizer">
        <div class="edge-glow left-glow"></div>
        <div class="edge-glow right-glow"></div>
    </div>
</body>
</html>
